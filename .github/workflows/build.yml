name: Build

on:
  push:
    branches-ignore: [test-results]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: Lumen
          path: build/libs/*.jar

  # Runs the real game on a virtual screen with software OpenGL, takes Lumen ON/OFF
  # screenshots and pushes them to the test-results branch.
  visual-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Install virtual display and software OpenGL
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb x11-xserver-utils libgl1-mesa-dri mesa-utils libxxf86vm1 libxtst6

      - name: Run Minecraft auto-test
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          chmod +x gradlew
          mkdir -p run
          # runObfClient runs the real release jar (reobfuscated, from the mods folder, with
          # MixinBooter) exactly like a player's game - not the development classes
          timeout 1800 xvfb-run -a -s "-screen 0 1280x720x24" \
            ./gradlew runObfClient --no-daemon -Pextra_jvm_args="-Dlumen.autotest=true" 2>&1 | tee client-output.log | grep -E "LUMEN-AUTOTEST|Exception|Error|FATAL|OpenGL|Mixin" || true

      - name: Publish results to test-results branch
        if: always()
        run: |
          mkdir -p /tmp/results
          SHOTS=$(dirname "$(find run -name lumen-report.txt | head -1)" 2>/dev/null)
          [ -n "$SHOTS" ] && cp "$SHOTS"/*.png "$SHOTS"/lumen-report.txt /tmp/results/ 2>/dev/null || true
          LOG=$(find run -path '*logs/latest.log' | head -1); [ -n "$LOG" ] && cp "$LOG" /tmp/results/latest.log || true
          # what's inside the release jar (mixin config + refmap must be there)
          JAR=$(ls build/libs/*.jar | grep -v -- '-dev\|-sources' | head -1)
          { echo "jar: $JAR"; unzip -l "$JAR"; echo; echo "--- MANIFEST"; unzip -p "$JAR" META-INF/MANIFEST.MF; echo "--- refmap"; unzip -p "$JAR" mixins.lumen.refmap.json; } > /tmp/results/jar-contents.txt 2>&1 || true
          find run -maxdepth 3 -name '*.jar' > /tmp/results/run-mods.txt 2>/dev/null || true
          tail -n 400 client-output.log > /tmp/results/client-output-tail.log 2>/dev/null || true
          ls -la /tmp/results
          cd /tmp/results
          git init -q -b test-results
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Visual test results for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" test-results
